<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>K Car 마이카 리뉴얼 · 3가지 디자인 비교</title>
  <link href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css" rel="stylesheet" type="text/css" />
  <style>
    /* ==========================================================================
       🌈 KCar C2C Design System_Final (L7kRm8n4WaisKzIqLyzQbT)
       1. Spoqa Han Sans Neo (ONLY 400 Regular, 500 Medium, 700 Bold)
       2. Exact Color, Typography, Spacing (4px/8px grid), Radius & Elevation Tokens
       ========================================================================== */
    @font-face {
      font-family: 'Spoqa Han Sans Neo';
      font-weight: 700;
      font-display: swap;
      src: local('Spoqa Han Sans Neo Bold'),
           url('./assets/fonts/SpoqaHanSansNeo-Bold.woff2') format('woff2'),
           url('../assets/fonts/SpoqaHanSansNeo-Bold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Spoqa Han Sans Neo';
      font-weight: 500;
      font-display: swap;
      src: local('Spoqa Han Sans Neo Medium'),
           url('./assets/fonts/SpoqaHanSansNeo-Medium.woff2') format('woff2'),
           url('../assets/fonts/SpoqaHanSansNeo-Medium.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Spoqa Han Sans Neo';
      font-weight: 400;
      font-display: swap;
      src: local('Spoqa Han Sans Neo Regular'),
           url('./assets/fonts/SpoqaHanSansNeo-Regular.woff2') format('woff2'),
           url('../assets/fonts/SpoqaHanSansNeo-Regular.woff2') format('woff2');
    }

    :root {
      /* Brand & Primary Scale */
      --primary-2: #9D0A2E;
      --primary-3: #B70F28; /* Brand Red (Default) */
      --primary-4: #F01D29; /* Active / Error */
      --primary-9: #FDEEEF;
      --primary-10: #FFF9F9;

      /* Gray Scale */
      --gray-1: #000000;
      --gray-2: #16171D; /* 기본 본문 텍스트 */
      --gray-3: #54555A; /* Sub Text */
      --gray-4: #82848B; /* 보조 캡션 */
      --gray-5: #999EA1;
      --gray-6: #B0B2BD; /* Main BTN Border */
      --gray-7: #D8DEE8; /* Main Border */
      --gray-8: #E8E8EE; /* Main Sub Border */
      --gray-9: #F1F1F4;
      --gray-10: #F2F2F2;
      --gray-11: #F6F8FA;
      --gray-12: #F9FAFB; /* Page BG */
      --gray-13: #FFFFFF; /* White */

      /* Semantic & Sub Scales */
      --info: #0086FF;
      --blue-10: #E5EEFC;
      --success: #02B260;
      --green-5: #0B845F;
      --green-10: #DDF2E5;
      --warning: #FBA900;
      --error: #DD1540;

      /* Radius */
      --r-xs: 4px;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 16px;
      --r-xl: 24px;

      /* Elevation (Shadow) */
      --z100: 0 2px 4px 0 rgba(22, 23, 29, 0.04), 0 0 1px 0 rgba(22, 23, 29, 0.16);
      --z200: 0 4px 8px -2px rgba(22, 23, 29, 0.08), 0 0 1px 0 rgba(22, 23, 29, 0.16);
      --z300: 0 8px 16px -4px rgba(22, 23, 29, 0.10), 0 0 1px 0 rgba(22, 23, 29, 0.16);

      --font-kcar: 'Spoqa Han Sans Neo', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-kcar);
      font-weight: 400;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.5px;
      color: var(--gray-2);
      background: #ECEEF3;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    button, input, select {
      font-family: var(--font-kcar);
      letter-spacing: -0.5px;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* ==========================================================================
       Exact KCar C2C Typography Scale
       ========================================================================== */
    .ty-h2   { font-size: 26px; line-height: 34px; letter-spacing: -0.5px; font-weight: 700; }
    .ty-h3   { font-size: 24px; line-height: 30px; letter-spacing: -0.5px; font-weight: 700; }
    .ty-h4   { font-size: 22px; line-height: 28px; letter-spacing: -0.5px; font-weight: 700; }
    .ty-sub1 { font-size: 20px; line-height: 26px; letter-spacing: -0.5px; font-weight: 700; }
    .ty-sub2 { font-size: 18px; line-height: 24px; letter-spacing: -0.5px; font-weight: 700; }
    .ty-sub3 { font-size: 16px; line-height: 22px; letter-spacing: -0.5px; font-weight: 700; }
    .ty-b1   { font-size: 14px; line-height: 20px; letter-spacing: -0.5px; font-weight: 400; }
    .ty-b1-m { font-size: 14px; line-height: 20px; letter-spacing: -0.5px; font-weight: 500; }
    .ty-b2   { font-size: 13px; line-height: 18px; letter-spacing: -0.5px; font-weight: 400; }
    .ty-b2-m { font-size: 13px; line-height: 18px; letter-spacing: -0.5px; font-weight: 500; }
    .ty-cap2 { font-size: 12px; line-height: 16px; letter-spacing: 0px;    font-weight: 500; }
    .num     { font-variant-numeric: tabular-nums; }

    /* ==========================================================================
       Official K Car Logo (Figma 22624:6418)
       ========================================================================== */

    /* ==========================================================================
       Top Control Bar (Clean Minimal K Car GNB)
       ========================================================================== */
    .top-gnb {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-8);
    }

    .top-gnb-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .gnb-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gnb-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .ctrl-seg {
      display: inline-flex;
      padding: 4px;
      background: var(--gray-9);
      border-radius: 8px;
      gap: 4px;
    }

    .ctrl-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-3);
      transition: all 0.16s ease;
    }

    .ctrl-btn.is-active {
      background: var(--gray-13);
      color: var(--gray-2);
      font-weight: 700;
      box-shadow: var(--z100);
    }

    .ctrl-btn.is-brand.is-active {
      background: var(--primary-3);
      color: var(--gray-13);
    }

    /* ==========================================================================
       Showcase Canvas (Natural Scroll — Zero Nested Cramped Scrollbars!)
       ========================================================================== */
    .stage-wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .stage-grid {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      justify-content: flex-start;
      overflow-x: auto;
      padding-bottom: 16px;
    }

    @media (min-width: 1280px) {
      .stage-grid {
        justify-content: center;
      }
    }

    .design-col {
      width: 396px;
      min-width: 396px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stage-grid.single-mode .design-col {
      width: 420px;
      min-width: 420px;
    }

    .design-col.is-hidden {
      display: none;
    }

    .design-label-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .design-tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--gray-2);
      color: var(--gray-13);
      font-size: 12px;
      font-weight: 700;
    }

    .design-tag.red { background: var(--primary-3); }
    .design-tag.blue { background: var(--info); }

    /* ==========================================================================
       Mobile App Shell (360~420dp K Car Standard Mobile Viewport)
       ========================================================================== */
    .mo-shell {
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 48px -12px rgba(22, 23, 29, 0.16), 0 0 0 1px rgba(22, 23, 29, 0.08);
      background: var(--gray-13);
      position: relative;
    }

    /* 1. Common App Header (56px, 20px side margin) */
    .mo-hdr {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--gray-13);
      border-bottom: 1px solid var(--gray-8);
    }

    .mo-hdr-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ico-back {
      width: 24px;
      height: 24px;
      margin-left: -6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .garage-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--gray-7);
      background: var(--gray-13);
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .garage-btn strong {
      color: var(--primary-3);
      font-weight: 700;
    }

    /* Garage Drawer */
    .mo-garage-drawer {
      display: none;
      padding: 16px 20px;
      background: var(--gray-11);
      border-bottom: 1px solid var(--gray-8);
      gap: 10px;
      overflow-x: auto;
    }
    .mo-garage-drawer.is-open {
      display: flex;
    }

    .g-item {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 10px;
      border-radius: var(--r-md);
      background: var(--gray-13);
      border: 1px solid var(--gray-7);
    }
    .g-item.is-active {
      border-color: var(--primary-3);
      background: var(--primary-10);
    }
    .g-item img {
      width: 44px;
      height: 28px;
      object-fit: contain;
    }

    /* Sticky Anchor Navigation (48px) */
    .mo-nav {
      display: flex;
      padding: 0 20px;
      background: var(--gray-13);
      border-bottom: 1px solid var(--gray-8);
      gap: 18px;
      overflow-x: auto;
    }
    .mo-nav::-webkit-scrollbar { display: none; }

    .mo-nav-btn {
      height: 46px;
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-4);
      position: relative;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mo-nav-btn.is-active {
      color: var(--gray-2);
      font-weight: 700;
    }

    .mo-nav-btn.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary-3);
    }

    /* ==========================================================================
       Generous Section Spacing & Common Primitives
       (Side Margin: 24px | Section Gap: 36px~40px | Title->Content: 20px)
       ========================================================================== */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    /* Badges (Minimal & Clean) */
    .bdg {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: var(--r-xs);
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0px;
      font-weight: 500;
    }
    .bdg-plate {
      background: var(--gray-9);
      color: var(--gray-2);
      font-weight: 700;
    }
    .bdg-gold {
      background: var(--green-10);
      color: var(--green-5);
      font-weight: 700;
    }
    .bdg-red {
      background: var(--primary-9);
      color: var(--primary-3);
      font-weight: 700;
    }
    .bdg-blue {
      background: var(--blue-10);
      color: var(--info);
      font-weight: 700;
    }

    /* Hero Car Stage (Airy Studio Whitespace!) */
    .car-stage {
      height: 164px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0 24px;
      border-radius: var(--r-lg);
    }

    .car-stage img {
      width: 268px;
      height: 136px;
      object-fit: contain;
      display: block;
    }

    /* 3-Column Clean Spec Row */
    .spec-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 18px 0;
      margin-bottom: 20px;
    }

    .spec-cell {
      text-align: center;
      border-right: 1px solid var(--gray-8);
    }
    .spec-cell:last-child { border-right: none; }

    /* Standard K Car 48px Large Action Buttons */
    .btn-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .kc-btn {
      width: 100%;
      height: 48px;
      border-radius: var(--r-md);
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .kc-btn-red {
      background: var(--primary-3);
      color: var(--gray-13);
    }
    .kc-btn-red:hover { background: var(--primary-2); }

    .kc-btn-line {
      background: var(--gray-13);
      border: 1px solid var(--gray-6);
      color: var(--gray-2);
    }
    .kc-btn-line:hover { background: var(--gray-11); }

    .kc-btn-soft {
      background: var(--gray-11);
      color: var(--gray-2);
      font-size: 14px;
      font-weight: 500;
    }

    /* Maintenance Gauges (Spacious 16px Gap) */
    .gauge-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .gauge-item {
      padding: 18px 20px;
      border-radius: var(--r-md);
    }

    .gauge-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .gauge-track {
      height: 6px;
      border-radius: 999px;
      background: var(--gray-8);
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* Simple Key-Value Schedule List */
    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Valuation 2-Card Comparison */
    .val-stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .val-box {
      padding: 20px 18px;
      border-radius: var(--r-lg);
      display: flex;
      flex-direction: column;
      gap: 8px;

  <script>
    /* ==========================================================================

       ========================================================================== */
    const GARAGE = [

        img: './assets/images/mycar/my_grandeur_studio.png',
        oilRemain: '2,100km 남음',
        oilPct: 78,
        tireRemain: '11,000km 남음',
        tirePct: 25,
        insurer: 'DB손해보험 · 26.11 만기',
        inspectDate: '2026.11.20 (D-62)',
        baseKcar: 2480,
        c2cPrice: 2750,
        specs: [
          ['최초등록일', '2020.11.20'],
          ['연료 / 배기량', '가솔린 · 2,497cc'],
          ['케이카 보증', 'KW12 가입 가능'],
          ['보험처리 이력', '0건 (완전 무사고)'],
          ['신차 출고정보', '경기도 성남시 개인 등록']
        ]
      }
    ];

    const INVENTORY = [
      { name: '아이오닉 5 롱레인지 프레스티지', sub: '23년 4월 · 2.4만km', price: 3150, img: './assets/images/mycar/studio_ioniq5.png' },
      { name: '더 뉴 쏘렌토 HEV 노블레스', sub: '24년 6월 · 1.8만km', price: 3890, img: './assets/images/mycar/studio_sorento.png' },
      { name: '디 올 뉴 그랜저 하이브리드', sub: '24년 3월 · 1.4만km', price: 4280, img: './assets/images/mycar/studio_grandeur_gn7.png' },

      { name: '제네시스 GV80 (F/L) 2.5T AWD', sub: '24년 11월 · 2.3만km', price: 6290, img: './assets/images/mycar/studio_gv80.png' },
      { name: '벤츠 E-클래스(W214) E200', sub: '24년 6월 · 1.5만km', price: 6450, img: './assets/images/mycar/studio_eclass_w214.png' },

      { name: '제네시스 G80 (F/L) 3.5T 스포츠', sub: '25년 1월 · 9천km', price: 6950, img: './assets/images/mycar/studio_g80_fl.png' },
      { name: 'BMW X7 xDrive 40d M 스포츠', sub: '23년 7월 · 3.8만km', price: 7850, img: './assets/images/mycar/my_x7_studio.png' },
      { name: 'BMW X6 xDrive 40i M 스포츠', sub: '23년 9월 · 2.9만km', price: 7920, img: './assets/images/mycar/studio_x6_g06.png' },
      { name: '벤츠 GLE 450 4MATIC', sub: '25년 4월 · 6천km', price: 9180, img: './assets/images/mycar/studio_gle.png' }
    ];

    let state = {
      carIdx: 0,
      extraBudget: 0, // 0, 500, 1500, 3000
      careScore: 88,
      careBonus: 60,
      missionDone: false,
      coupons: { c1: false, c2: false, c3: false },
      garageOpen: { 1: false, 2: false, 3: false },
      viewMode: 'compare',
      selectedType: 1
    };

    const fmt = n => n.toLocaleString('ko-KR');

    function getTradeRecommendations(myPrice, extra) {
      const maxBudget = myPrice + extra;
      let list;
      if (extra === 0) {
        list = INVENTORY.filter(c => c.price <= myPrice + 20 && c.price >= myPrice - 1800)
          .sort((a, b) => b.price - a.price);
        if (list.length < 2) {
          list = INVENTORY.filter(c => c.price <= myPrice + 150).sort((a, b) => b.price - a.price);
        }
      } else {
        const minPrice = myPrice + Math.max(50, extra - 1100);
        list = INVENTORY.filter(c => c.price > minPrice && c.price <= maxBudget + 200)
          .sort((a, b) => a.price - b.price);
        if (list.length < 2) {
          list = INVENTORY.filter(c => c.price > myPrice && c.price <= maxBudget + 400)
            .sort((a, b) => b.price - a.price);
        }
      }
      return list.slice(0, 3);
    }

    /* ==========================================================================
       Shared Component Renderer (100% Identical Structure & Functions!)
       ========================================================================== */
    function buildAppHTML(typeNum) {
      const car = GARAGE[state.carIdx];
      const kcarPrice = car.baseKcar + state.careBonus;
      const c2cDiff = car.c2cPrice - kcarPrice;
      const tradeCars = getTradeRecommendations(kcarPrice, state.extraBudget);
      const isDarkHdr = typeNum === 3;

      const garageItemsHTML = GARAGE.map((g, idx) => `
        <button type="button" class="g-item ${idx === state.carIdx ? 'is-active' : ''}" onclick="changeCar(${idx})">
          <img src="${g.img}" alt="${g.name}" />
          <div style="text-align:left;">
            <div class="ty-b2-m" style="font-weight:700;color:var(--gray-2);">${g.plate}</div>
            <div class="ty-cap2" style="color:var(--gray-4);">${g.name}</div>
          </div>
        </button>
      `).join('');

      const tradeCardsHTML = tradeCars.map(item => {
        const diff = item.price - kcarPrice;
        const badgeHTML = diff <= 0
          ? `<span class="bdg bdg-gold">${diff === 0 ? '추가금 0원' : `0원 · ${fmt(Math.abs(diff))}만원 환급`}</span>`
          : `<span class="bdg bdg-red">+${fmt(diff)}만원 추가</span>`;

        return `
          <div class="trade-item">
            <div class="trade-img-wrap">
              <img src="${item.img}" alt="${item.name}" />
            </div>
            <div class="trade-info">
              <div class="ty-sub3" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</div>
              <div class="ty-b2" style="color:var(--gray-4);">${item.sub}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px;flex-wrap:wrap;">
                <span class="ty-sub2 num">${fmt(item.price)}만원</span>
                ${badgeHTML}
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <!-- Header -->
        <header class="mo-hdr">
          <div class="mo-hdr-left">
            <span class="ico-back" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${isDarkHdr ? '#FFFFFF' : '#16171D'}" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </span>
            <span class="kcar-logo ${isDarkHdr ? 'on-dark' : ''}"></span>
            <span class="ty-sub3" style="font-weight:500;">마이카</span>
          </div>
          <button type="button" class="garage-btn" onclick="toggleGarage(${typeNum})">
            내 차고 <strong>3</strong> ▾
          </button>
        </header>

        <!-- Garage Drawer -->
        <div class="mo-garage-drawer ${state.garageOpen[typeNum] ? 'is-open' : ''}">
          ${garageItemsHTML}
        </div>

        <!-- Clean Anchor Bar -->
        <nav class="mo-nav">
          <button type="button" class="mo-nav-btn is-active" onclick="jumpToSec(${typeNum}, 'sec1')">내차정보</button>
          <button type="button" class="mo-nav-btn" onclick="jumpToSec(${typeNum}, 'sec2')">차량관리</button>
          <button type="button" class="mo-nav-btn" onclick="jumpToSec(${typeNum}, 'sec3')">예상시세</button>
          <button type="button" class="mo-nav-btn" onclick="jumpToSec(${typeNum}, 'sec4')">갈아타기</button>
          <button type="button" class="mo-nav-btn" onclick="jumpToSec(${typeNum}, 'sec5')">우대·제휴</button>
        </nav>

        <div class="mo-body">

          <!-- 01. 등록 차량 정보 -->
          <section class="mo-sec sec-hero" id="t${typeNum}_sec1">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
              <span class="bdg bdg-plate num">${car.plate}</span>
              <span class="bdg bdg-gold">${state.missionDone ? 'VIP 관리인증' : 'GOLD 관리인증'}</span>
            </div>

            <h2 class="ty-h3">${car.name}</h2>
            <p class="ty-b1 ty-sub-txt" style="color:var(--gray-3);margin-top:4px;">${car.trim}</p>

            <div class="car-stage">
              <img src="${car.img}" alt="${car.name}" />
            </div>

            <div class="spec-row-3">
              <div class="spec-cell">
                <div class="ty-b2 spec-lbl-txt" style="color:var(--gray-4);margin-bottom:4px;">연식</div>
                <div class="ty-sub3 num">${car.year}</div>
              </div>
              <div class="spec-cell">
                <div class="ty-b2 spec-lbl-txt" style="color:var(--gray-4);margin-bottom:4px;">주행거리</div>
                <div class="ty-sub3 num">${car.km}</div>
              </div>
              <div class="spec-cell">
                <div class="ty-b2 spec-lbl-txt" style="color:var(--gray-4);margin-bottom:4px;">이력</div>
                <div class="ty-sub3">${car.historyShort}</div>
              </div>
            </div>

            <button type="button" class="kc-btn kc-btn-soft" onclick="openModal()">
              기본 제원 · 이력 상세보기
            </button>
          </section>

          <!-- 02. 차량 관리 -->
          <section class="mo-sec" id="t${typeNum}_sec2">
            <div class="sec-head">
              <h3 class="ty-sub1">내 차 관리</h3>
              <span class="ty-b2-m" style="color:var(--info);">정비 등록 +</span>
            </div>

            <div class="gauge-stack">
              <div class="gauge-item">
                <div class="gauge-top">
                  <span class="ty-sub3">엔진오일</span>
                  <span class="ty-b1-m num" style="color:var(--error);">${car.oilRemain}</span>
                </div>
                <div class="gauge-track">
                  <div class="gauge-fill" style="width:${car.oilPct}%;background:var(--primary-3);"></div>
                </div>
              </div>

              <div class="gauge-item">
                <div class="gauge-top">
                  <span class="ty-sub3">타이어 점검</span>
                  <span class="ty-b1-m num" style="color:var(--gray-3);">${car.tireRemain}</span>
                </div>
                <div class="gauge-track">
                  <div class="gauge-fill" style="width:${car.tirePct}%;background:var(--info);"></div>
                </div>
              </div>
            </div>

            <div class="kv-list">
              <div class="kv-row">
                <span class="ty-b1" style="color:var(--gray-3);">자동차 보험</span>
                <span class="ty-b1-m" style="font-weight:700;">${car.insurer}</span>
              </div>
              <div class="kv-row">
                <span class="ty-b1" style="color:var(--gray-3);">법정 정기검사</span>
                <span class="ty-b1-m num" style="font-weight:700;">${car.inspectDate}</span>
              </div>
              <div class="kv-row">
                <span class="ty-b1" style="color:var(--gray-3);">과태료 · 하이패스</span>
                <span class="ty-b1-m" style="color:var(--green-5);font-weight:700;">미납 0건</span>
              </div>
            </div>
          </section>

          <!-- 03. 예상 시세 (직영 vs 직거래) -->
          <section class="mo-sec" id="t${typeNum}_sec3">
            <div class="sec-head">
              <h3 class="ty-sub1">예상 매각 시세</h3>
              <span class="bdg bdg-gold">우대 +${state.careBonus}만원 반영</span>
            </div>

            <div class="val-stack">
              <div class="val-box is-primary">
                <span class="ty-b2-m" style="color:var(--gray-3);">케이카 직영매각</span>
                <strong class="ty-h3 num" style="color:var(--primary-3);">${fmt(kcarPrice)}만원</strong>
                <span class="ty-cap2" style="color:var(--primary-3);">당일 무료 방문견적</span>
              </div>

              <div class="val-box">
                <span class="ty-b2-m" style="color:var(--gray-3);">안심직거래 예상가</span>
                <strong class="ty-h3 num">${fmt(car.c2cPrice)}만원</strong>
                <span class="ty-cap2" style="color:var(--info);">직영 대비 +${fmt(c2cDiff)}만원</span>
              </div>
            </div>

            <div class="btn-row-2">
              <button type="button" class="kc-btn kc-btn-red">내차팔기 신청</button>
              <button type="button" class="kc-btn kc-btn-line">직거래 등록</button>
            </div>
          </section>

          <!-- 04. 케이카 갈아타기 (추가금 0원 ~ 금액별) -->
          <section class="mo-sec" id="t${typeNum}_sec4">
            <div class="sec-head" style="margin-bottom:8px;">
              <h3 class="ty-sub1">내 차 팔고 갈아타기</h3>
            </div>
            <p class="ty-b1" style="color:var(--gray-3);margin-bottom:20px;">
              내 차 시세 <strong style="color:var(--gray-2);">${fmt(kcarPrice)}만원</strong> 기준 추천 직영차
            </p>

            <div class="chip-row">
              <button type="button" class="flt-chip ${state.extraBudget === 0 ? 'is-active' : ''}" onclick="setExtraBudget(0)">추가금 0원</button>
              <button type="button" class="flt-chip ${state.extraBudget === 500 ? 'is-active' : ''}" onclick="setExtraBudget(500)">+500만원</button>
              <button type="button" class="flt-chip ${state.extraBudget === 1500 ? 'is-active' : ''}" onclick="setExtraBudget(1500)">+1,500만원</button>
              <button type="button" class="flt-chip ${state.extraBudget === 3000 ? 'is-active' : ''}" onclick="setExtraBudget(3000)">+2,500만원</button>
            </div>

            <div class="car-list-stack">
              ${tradeCardsHTML}
            </div>
          </section>

          <!-- 05 & 06. 관리이력 매각우대 & 케이카 제휴 할인 -->
          <section class="mo-sec" id="t${typeNum}_sec5">
            <div class="sec-head">
              <h3 class="ty-sub1">관리 우대 · 제휴 혜택</h3>
            </div>

            <!-- 관리이력 -> 향후 매각 우대 보상 -->
            <div class="reward-box" style="margin-bottom:28px;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                <span class="ty-b1-m ty-sub-txt" style="color:var(--gray-3);">케어 점수 ${state.careScore}점</span>
                <span class="bdg bdg-gold">${state.missionDone ? 'VIP 등급' : 'GOLD 등급'}</span>
              </div>
              <div class="ty-h4 num reward-price" style="color:var(--primary-3);">
                케이카 매각 시 +${state.careBonus}만원 우대
              </div>
              <div class="gauge-track" style="margin:18px 0 20px;height:8px;">
                <div class="gauge-fill" style="width:${state.careScore}%;background:var(--primary-3);"></div>
              </div>
              <button type="button" class="kc-btn ${state.missionDone ? 'kc-btn-soft' : 'kc-btn-red'}" onclick="runMission()">
                ${state.missionDone ? '✓ 정비 인증 완료 (+85만원 적용됨)' : '제휴 정비 인증하고 +85만원 받기'}
              </button>
            </div>

            <!-- 케이카 제휴 할인 3종 -->
            <div class="benefit-stack">
              <div class="benefit-item">
                <div>
                  <div class="ty-sub3">스피드메이트 엔진오일 35%</div>
                  <div class="ty-b2" style="color:var(--gray-4);margin-top:4px;">이용 시 매각우대 +25만원 적립</div>
                </div>
                <button type="button" class="btn-coupon ${state.coupons.c1 ? 'is-done' : ''}" onclick="getCoupon('c1')">
                  ${state.coupons.c1 ? '발급됨' : '쿠폰받기'}
                </button>
              </div>

              <div class="benefit-item">
                <div>
                  <div class="ty-sub3">T-Station 타이어 30%</div>
                  <div class="ty-b2" style="color:var(--gray-4);margin-top:4px;">이용 시 매각우대 +15만원 적립</div>
                </div>
                <button type="button" class="btn-coupon ${state.coupons.c2 ? 'is-done' : ''}" onclick="getCoupon('c2')">
                  ${state.coupons.c2 ? '발급됨' : '쿠폰받기'}
                </button>
              </div>

              <div class="benefit-item">
                <div>
                  <div class="ty-sub3">갓차 출장세차 45%</div>
                  <div class="ty-b2" style="color:var(--gray-4);margin-top:4px;">케이카 마이카 고객 상시 할인</div>
                </div>
                <button type="button" class="btn-coupon ${state.coupons.c3 ? 'is-done' : ''}" onclick="getCoupon('c3')">
                  ${state.coupons.c3 ? '발급됨' : '쿠폰받기'}
                </button>
              </div>
            </div>
          </section>

        </div>

        <!-- Bottom Tab Bar -->
        <nav class="mo-tabbar">
          <div>홈</div>
          <div>내차사기</div>
          <div>내차팔기</div>
          <div class="is-on">마이카</div>
          <div>전체</div>
        </nav>
      `;
    }

    function renderAll() {
      [1, 2, 3].forEach(t => {
        document.getElementById('mount' + t).innerHTML = buildAppHTML(t);
      });
    }

    function changeCar(idx) {
      state.carIdx = idx;
      [0, 1, 2].forEach(i => {
        document.getElementById('carBtn' + i).classList.toggle('is-active', i === idx);
      });
      renderAll();
    }

    function setExtraBudget(val) {
      state.extraBudget = val;
      renderAll();
    }

    function runMission() {
      if (state.missionDone) return;
      state.missionDone = true;
      state.careScore = 96;
      state.careBonus = 85;
      renderAll();
    }

    function getCoupon(key) {
      state.coupons[key] = true;
      renderAll();
    }

    function toggleGarage(typeNum) {
      state.garageOpen[typeNum] = !state.garageOpen[typeNum];
      renderAll();
    }

    function jumpToSec(typeNum, secKey) {
      const el = document.getElementById(`t${typeNum}_${secKey}`);
      if (el) {
        const y = el.getBoundingClientRect().top + window.scrollY - 76;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }

    function openModal() {
      const car = GARAGE[state.carIdx];
      document.getElementById('modalContent').innerHTML = car.specs.map(row => `
        <div class="kv-row" style="padding-bottom:12px;border-bottom:1px solid var(--gray-8);">
          <span class="ty-b1" style="color:var(--gray-3);">${row[0]}</span>
          <span class="ty-b1-m" style="font-weight:700;">${row[1]}</span>
        </div>
      `).join('');
      document.getElementById('specModal').classList.add('is-open');
    }

    function closeModal() {
      document.getElementById('specModal').classList.remove('is-open');
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const grid = document.getElementById('stageGrid');
      document.getElementById('modeCompareBtn').classList.toggle('is-active', mode === 'compare');
      document.getElementById('modeCompareBtn').classList.toggle('is-brand', mode === 'compare');
      document.getElementById('modeSingleBtn').classList.toggle('is-active', mode === 'single');
      document.getElementById('modeSingleBtn').classList.toggle('is-brand', mode === 'single');

      grid.classList.toggle('single-mode', mode === 'single');

      if (mode === 'compare') {
        [1, 2, 3].forEach(t => document.getElementById('col' + t).classList.remove('is-hidden'));
      } else {
        selectDesign(state.selectedType);
      }
    }

    function selectDesign(num) {
      state.selectedType = num;
      [1, 2, 3].forEach(t => {
        document.getElementById('selT' + t).classList.toggle('is-active', t === num);
      });
      if (state.viewMode === 'single') {
        [1, 2, 3].forEach(t => {
          document.getElementById('col' + t).classList.toggle('is-hidden', t !== num);
        });
      } else {
        document.getElementById('col' + num).scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    renderAll();
  </script>
</body>
</html>
